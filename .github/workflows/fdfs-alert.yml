 Save this file at: .github/workflows/fdfs-alert.yml
# Place avengers_doomsday_fdfs_alert.py in the root of your public GitHub repository.
#
# Required GitHub Repository Secret (Settings -> Secrets and variables -> Actions):
#   NTFY_TOPIC          Your private ntfy.sh topic name (e.g. chennai-doomsday-fdfs-9482)
#
# Optional GitHub Repository Secrets (only if you also want Telegram alerts):
#   TELEGRAM_BOT_TOKEN  Your Telegram bot token
#   TELEGRAM_CHAT_ID    Your Telegram chat ID

name: Avengers Doomsday Chennai FDFS Alert

on:
  schedule:
    # Runs roughly every 5 minutes (minimum GitHub Actions cron interval).
    # Change to '*/10 * * * *' for every 10 minutes.
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      test_alert:
        description: 'Send a test push notification to your phone instead of scraping'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: doomsday-fdfs-monitor
  cancel-in-progress: false

jobs:
  check-fdfs-tickets:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 playwright

      - name: Cache Playwright Chromium browser
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('avengers_doomsday_fdfs_alert.py') }}
          restore-keys: |
            playwright-chromium-${{ runner.os }}-

      - name: Install Playwright Chromium
        run: |
          if [ "${{ steps.playwright-cache.outputs.cache-hit }}" != "true" ]; then
            playwright install chromium
          fi
          playwright install-deps chromium

      - name: Run FDFS Ticket Monitor
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ "${{ inputs.test_alert }}" = "true" ]; then
            python3 avengers_doomsday_fdfs_alert.py --test-alert
          else
            python3 avengers_doomsday_fdfs_alert.py --once --date 2026-12-17 --cutoff 10:30
          fi

      - name: Save seen shows state (prevents duplicate phone alerts)
        if: inputs.test_alert != true
        run: |
          if [ -n "$(git status --porcelain seen_fdfs_shows.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add seen_fdfs_shows.json
            git commit -m "Update seen Chennai FDFS shows [skip ci]"
            git push
          fi
